plugins {
  id 'java-gradle-plugin'
  id 'checkstyle'
}

repositories {
  mavenLocal()
  mavenCentral()
  gradlePluginPortal()
}


dependencies {
  implementation 'org.yaml:snakeyaml:2.0'
  implementation "me.champeau.gradle:japicmp-gradle-plugin:0.4.1"
  implementation "org.gradle:test-retry-gradle-plugin:1.6.2"
  // implementation("org.asciidoctor:asciidoctor-gradle-jvm:3.3.2")
  implementation "io.spring.javaformat:spring-javaformat-gradle-plugin:${javaFormatVersion}"
  implementation("org.apache.maven:maven-artifact:3.9.16")
  implementation 'cn.taketoday:infra-core:5.0-Draft.9'
  implementation 'cn.taketoday:maven-central-publishing-gradle-plugin:1.0.1'

  implementation("net.ltgt.gradle:gradle-errorprone-plugin:4.3.0")
}

gradlePlugin {
  plugins {
    create("apiDiffPlugin") {
      id = "infra.building.api-diff"
      implementationClass = "infra.building.api.ApiDiffPlugin"
    }
    create("bomPlugin") {
      id = "infra.bom"
      implementationClass = "infra.building.bom.BomPlugin"
    }
    create("conventionsPlugin") {
      id = "infra.building.conventions"
      implementationClass = "infra.building.ConventionsPlugin"
    }
    create("multiReleasePlugin") {
      id = "infra.building.multiReleaseJar"
      implementationClass = "infra.building.multirelease.MultiReleaseJarPlugin"
    }
    create("optionalDependenciesPlugin") {
      id = "infra.building.optional-dependencies"
      implementationClass = "infra.building.optional.OptionalDependenciesPlugin"
    }
    create("dockerTestPlugin") {
      id = "infra.building.docker-test"
      implementationClass = "infra.building.test.DockerTestPlugin"
    }
    create("integrationTestPlugin") {
      id = "infra.building.integration-test"
      implementationClass = "infra.building.test.IntegrationTestPlugin"
    }
    create("runtimeHintsAgentPlugin") {
      id = "infra.building.runtimehints-agent"
      implementationClass = "infra.building.hint.RuntimeHintsAgentPlugin"
    }
    create("mavenPluginPlugin") {
      id = "infra.maven-plugin"
      implementationClass = "infra.building.maven.MavenPluginPlugin"
    }
    create("generateAntoraYml") {
      id = 'infra.generate-antora-yml'
      implementationClass = 'infra.building.antora.GenerateAntoraYmlPlugin'
    }
    create("nullability") {
      id = "infra.nullability"
      implementationClass = "infra.building.nullability.NullabilityPlugin"
    }
  }
}
