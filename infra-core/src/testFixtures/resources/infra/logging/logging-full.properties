# Full Java Util Logging configuration used when the FULL_LOG test group is active
# (-PtestGroups=FULL_LOG). It is selected via the java.util.logging.config.file
# system property set by TestConventions, so every module test JVM that falls back to
# JUL starts with the root logger at FINEST. Set handlers to /dev/null (discard) to
# avoid noisy stack-trace output; tests assert behavior, not print logs.
handlers = java.util.logging.ConsoleHandler
.level = FINEST

java.util.logging.ConsoleHandler.level = FINEST
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
