publishing.publications.withType(MavenPublication.class).configureEach {
  def publicationName = project.name
  def publicationDescription = project.description
  // Test fixture capabilities are preserved in Gradle module metadata, not Maven POMs.
  suppressPomMetadataWarningsFor('testFixturesApiElements')
  suppressPomMetadataWarningsFor('testFixturesRuntimeElements')

  pom {
    name = publicationName
    description = publicationDescription
    url = "https://github.com/TAKETODAY/today-infrastructure"
    organization {
      name = "TODAY Tech"
      url = "https://taketoday.cn"
    }
    licenses {
      license {
        name = 'The Apache License, Version 2.0'
        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
        distribution = "repo"
      }
    }
    scm {
      url = "https://github.com/TAKETODAY/today-infrastructure.git"
      connection = "scm:git:git://github.com/TAKETODAY/today-infrastructure"
      developerConnection = "scm:git:git://github.com/TAKETODAY/today-infrastructure"
    }
    developers {
      developer {
        id = "taketoday"
        name = "Harry Yang"
        email = "i.take.today@gmail.com"
      }
    }
    issueManagement {
      system = "GitHub"
      url = "https://github.com/TAKETODAY/today-infrastructure/issues"
    }
  }
  versionMapping {
    usage('java-api') {
      fromResolutionResult()
    }
    usage('java-runtime') {
      fromResolutionResult()
    }
  }
}
