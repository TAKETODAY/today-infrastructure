apply plugin: "signing"
apply plugin: "maven-publish"

// 所有模块统一发布到根项目的聚合 staging 目录，由根项目一次性打包上传到 Maven Central。
publishing.repositories {
  maven {
    name = "mavenCentralStaging"
    url = rootProject.layout.buildDirectory.dir("maven-central-publishing/staging-repository")
  }
}

publishing.publications.withType(MavenPublication.class) {
  // Test fixture capabilities are preserved in Gradle module metadata, not Maven POMs.
  suppressPomMetadataWarningsFor('testFixturesApiElements')
  suppressPomMetadataWarningsFor('testFixturesRuntimeElements')

  pom {
    afterEvaluate {
      name = project.name
      description = project.description
    }
    url = "https://github.com/TAKETODAY/today-infrastructure"
    organization {
      name = "TODAY Tech"
      url = "https://taketoday.cn"
    }
    licenses {
      license {
        name = 'The Apache License, Version 2.0'
        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
        distribution = "repo"
      }
    }
    scm {
      url = "https://github.com/TAKETODAY/today-infrastructure.git"
      connection = "scm:git:git://github.com/TAKETODAY/today-infrastructure"
      developerConnection = "scm:git:git://github.com/TAKETODAY/today-infrastructure"
    }
    developers {
      developer {
        id = "taketoday"
        name = "Harry Yang"
        email = "i.take.today@gmail.com"
      }
    }
    issueManagement {
      system = "GitHub"
      url = "https://github.com/TAKETODAY/today-infrastructure/issues"
    }
  }
  versionMapping {
    usage('java-api') {
      fromResolutionResult()
    }
    usage('java-runtime') {
      fromResolutionResult()
    }
  }
}
