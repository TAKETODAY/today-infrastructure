import java.time.Duration
import cn.taketoday.publishing.BundleFormat
import cn.taketoday.publishing.PublishingType

plugins {
  id 'com.gradleup.shadow' version "9.1.0" apply false
  id 'de.undercouch.download' version '5.4.0'
  id 'io.freefair.aspectj' version '8.13.1' apply false
  id 'me.champeau.mrjar' version '0.1.1'
  id 'me.champeau.jmh' version '0.7.2' apply false
  id "io.github.gradle-nexus.publish-plugin" version "2.0.0"
  id "com.google.protobuf" version "0.9.6" apply false
  id "cn.taketoday.publishing" version "0.0.4"
}

ext {
  isSnapshot = version.endsWith('SNAPSHOT')
  isReleaseVersion = !isSnapshot
  starterProjects = subprojects.findAll { it.name.startsWith("infra-starter") }
  moduleProjects = subprojects.findAll { it.name.startsWith("infra-") && !it.name.startsWith("infra-starter") } + [
      project(":infra-build:infra-annotation-config-processor"),
      project(":infra-build:infra-configuration-processor"),
      project(":infra-build:infra-app-loader"),
      project(":infra-build:infra-app-loader-tools"),
      project(":infra-build:infra-jarmode-layertools"),
      project(":infra-build:infra-gradle-plugin"),
      project(":infra-build:infra-maven-plugin"),
  ] - [
      project(":infra-bom"),
      project(":infra-docs"),
      project(":infra-build"),
      project(":infra-dependencies"),
      project(":infra-build:infra-code-coverage")
  ]
  javaProjects = subprojects - starterProjects - [
      project(":infra-build:infra-code-coverage"), project(":module"),
      project(":infra-bom"), project(":infra-build"), project(":infra-dependencies"),
  ]
  testFixturesProjects = [
      project(":infra-core"),
      project(":infra-aop"),
      project(":infra-beans"),
      project(":infra-context"),
      project(":infra-jcache"),
      project(":infra-web"),
      project(":infra-web-client"),
      project(":infra-webmvc"),
      project(":infra-test"),
      project(":infra-tx")
  ] as Set
}

configure(allprojects) {
  group = "cn.taketoday"

  if (it.hasProperty("skipDocs")) {
    it.afterEvaluate {
      it.getTasks().matching(task -> {
        return JavaBasePlugin.DOCUMENTATION_GROUP == task.getGroup()
            || "distribution" == task.getGroup()
      }).forEach(task -> task.setEnabled(false))
    }
  }

  repositories {
//    maven { url "https://maven.aliyun.com/repository/public" }
//    maven { url "https://repo.huaweicloud.com/repository/maven" }
    mavenCentral()
    if (version.contains('-')) {
      maven { url = "https://repo.spring.io/milestone" }
    }
    if (version.endsWith('-SNAPSHOT')) {
      mavenLocal()
      maven { url = "https://repo.spring.io/snapshot" }
    }
  }
  configurations.configureEach {
    resolutionStrategy {
      cacheChangingModulesFor 0, "seconds"
      cacheDynamicVersionsFor 0, "seconds"
    }
  }
}

configure([rootProject] + javaProjects) {
  apply plugin: "java"
  apply plugin: 'infra.building.conventions'
  apply plugin: 'infra.building.optional-dependencies'

  if (it.hasProperty("code-coverage")) {
    apply plugin: 'jacoco'
    jacocoTestReport {
      enabled = false
    }
  }

  if (testFixturesProjects.contains(it)) {
    apply plugin: "java-test-fixtures"
  }

  dependencies {
    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testImplementation("org.junit.jupiter:junit-jupiter-params")
    testImplementation("org.junit.platform:junit-platform-suite-api")
    testImplementation("org.mockito:mockito-core")
    testImplementation("org.mockito:mockito-junit-jupiter")
    testImplementation("org.assertj:assertj-core")

    // Pull in the latest JUnit 5 Launcher API to ensure proper support in IDEs.
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testRuntimeOnly("org.junit.platform:junit-platform-suite-engine")
    // 去除 测试警告
    testRuntimeOnly("com.google.code.findbugs:jsr305")
    testRuntimeOnly("com.google.code.findbugs:findbugs")
    testRuntimeOnly('org.jboss.logging:jboss-logging:3.6.3.Final')

    // JSR-305 only used for non-required meta-annotations
    compileOnly("com.google.code.findbugs:jsr305")
    compileOnly("com.google.code.findbugs:findbugs")
    compileOnly('org.jboss.logging:jboss-logging:3.6.3.Final')
  }

  ext.javadocLinks = [
      "https://docs.oracle.com/en/java/javase/17/docs/api/",
      "https://hc.apache.org/httpcomponents-client-5.5.x/current/httpclient5/apidocs/",
      // "https://projectreactor.io/docs/core/release/api/",
      // "https://projectreactor.io/docs/test/release/api/",
      "https://junit.org/junit4/javadoc/4.13.2/",
      "https://docs.junit.org/6.1.0/api/",
      "https://www.reactive-streams.org/reactive-streams-1.0.4-javadoc/",
      "https://jspecify.dev/docs/api/"
  ] as String[]
}

configure(starterProjects) {
  apply from: "${rootDir}/gradle/infra-starter.gradle"
}

configure(moduleProjects) {
  apply from: "${rootDir}/gradle/infra-module.gradle"
}

configure(rootProject) {
  description = "TODAY Infrastructure"
  apply plugin: 'infra.building.api-diff'

  // 聚合发布：所有子模块先发布到统一 staging 目录，再一次性打包上传到 Maven Central。
  def stagingPublishTasks = subprojects.findAll { it.pluginManager.hasPlugin('maven-publish') }
      .collect { it.tasks.named('publishAllPublicationsToMavenCentralStagingRepository') }

  tasks.named('publishAllPublicationsToMavenCentralStagingRepository').configure {
    dependsOn stagingPublishTasks
  }
  tasks.named('uploadMavenCentralBundle').configure {
    dependsOn stagingPublishTasks
  }
  tasks.named('publishToMavenCentral').configure {
    dependsOn stagingPublishTasks
  }
}


// SNAPSHOT 发布使用 gradle-nexus 的 snapshots 仓库；正式版由 cn.taketoday.publishing 聚合一次上传。
nexusPublishing {
  String repoUsername = project.properties["repoUsername"] ?: System.getenv("SNAPSHOTS_USERNAME")
  String repoPassword = project.properties["repoPassword"] ?: System.getenv("SNAPSHOTS_TOKEN")

  repositories {
    sonatype {
      username.set(repoUsername)
      password.set(repoPassword)
      nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
      snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
    }
  }

  connectTimeout.set(Duration.ofMinutes(5))
  clientTimeout.set(Duration.ofMinutes(10))
}

mavenCentral {
  bundle {
    format = BundleFormat.TAR_GZ
  }

  maxStatusRetries = 5
  publishingType = PublishingType.AUTOMATIC
}
