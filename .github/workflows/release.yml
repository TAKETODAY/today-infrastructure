name: Release
on:
  push:
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  build-and-stage-release:
    name: Build and Stage Release
    if: github.repository_owner == 'TAKETODAY'
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7

      - name: Set Up Java
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '25'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read Release Version
        id: release-version
        uses: ./.github/actions/read-version

      - name: Validate Release Version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          if [[ -z "$RELEASE_VERSION" || "$RELEASE_VERSION" == *SNAPSHOT ]]; then
            echo 'Release requires a non-empty, non-SNAPSHOT version in gradle.properties.' >&2
            exit 1
          fi

      # 聚合一次上传：所有模块发布到根聚合 staging，私有插件打包后上传成一个 deployment。
      - name: Build and Publish
        id: build-and-publish
        shell: bash
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SNAPSHOTS_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SNAPSHOTS_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.SIGNID }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNPWD }}
        run: ./gradlew --no-daemon --no-parallel publishToMavenCentral -PportalPublishing=true -PbuildSrc.skipTests=true

      - name: Upload release reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release reports
          path: "**/build/publishing/"

    outputs:
      version: ${{ steps.release-version.outputs.version }}

  sync-to-maven-central:
    name: Sync to Maven Central
    if: github.repository_owner == 'TAKETODAY'
    needs:
      - build-and-stage-release
      - publish-gradle-plugin
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7

      - name: Download release reports
        uses: actions/download-artifact@v8
        with:
          name: release reports
          path: release-reports

      - name: Await Sync to Maven Central
        uses: ./.github/actions/await-maven-central
        with:
          version: ${{ needs.build-and-stage-release.outputs.version }}
          staging-root: release-reports

  publish-gradle-plugin:
    name: Publish Gradle Plugin
    if: github.repository_owner == 'TAKETODAY'
    needs:
      - build-and-stage-release
    runs-on: 'ubuntu-latest'
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
      - name: Publish
        uses: ./.github/actions/publish-gradle-plugin
        with:
          gradle-plugin-publish-key: ${{ secrets.GRADLE_PLUGIN_PUBLISH_KEY }}
          gradle-plugin-publish-secret: ${{ secrets.GRADLE_PLUGIN_PUBLISH_SECRET }}
          plugin-version: ${{ needs.build-and-stage-release.outputs.version }}
          signing-keyId: ${{ secrets.SIGNID }}
          signing-password: ${{ secrets.SIGNPWD }}
          signing-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
