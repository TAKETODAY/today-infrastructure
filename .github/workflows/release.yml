name: Release
on:
  push:
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  build-and-stage-release:
    name: Build and Stage Release
    if: github.repository_owner == 'TAKETODAY'
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7

      - name: Set Up Java and Gradle
        uses: ./.github/actions/setup-java-gradle

      - name: Read Release Version
        id: release-version
        uses: ./.github/actions/read-version

      - name: Validate Release Version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          if [[ -z "$RELEASE_VERSION" || "$RELEASE_VERSION" == *SNAPSHOT ]]; then
            echo 'Release requires a non-empty, non-SNAPSHOT version in gradle.properties.' >&2
            exit 1
          fi

      # 聚合一次上传：所有模块发布到根聚合 staging，私有插件打包后上传成一个 deployment。
      - name: Build and Publish
        id: build-and-publish
        shell: bash
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SNAPSHOTS_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SNAPSHOTS_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.SIGNID }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNPWD }}
          ORG_GRADLE_PROJECT_portalPublishing: true
        run: ./gradlew --no-daemon --no-parallel publishToMavenCentral -PbuildSrc.skipTests=true

      - name: Upload release reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release reports
          path: "**/build/publishing/"

    outputs:
      version: ${{ steps.release-version.outputs.version }}

  await-release-sync:
    name: Await Release Sync
    timeout-minutes: 60
    if: github.repository_owner == 'TAKETODAY'
    needs:
      - build-and-stage-release
      - publish-gradle-plugin
    runs-on: 'ubuntu-latest'
    strategy:
      matrix:
        check:
          - name: maven-central
            staging-root: release-reports
          - name: plugin-application
            url: ${{ format('https://plugins.gradle.org/m2/cn/taketoday/application/cn.taketoday.application.gradle.plugin/{0}/cn.taketoday.application.gradle.plugin-{0}.pom', needs.build-and-stage-release.outputs.version) }}
          - name: plugin-aot
            url: ${{ format('https://plugins.gradle.org/m2/cn/taketoday/application/aot/cn.taketoday.application.aot.gradle.plugin/{0}/cn.taketoday.application.aot.gradle.plugin-{0}.pom', needs.build-and-stage-release.outputs.version) }}
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7

      - name: Download release reports
        if: matrix.check.name == 'maven-central'
        uses: actions/download-artifact@v8
        with:
          name: release reports
          path: release-reports

      - name: Await Maven Central Sync
        if: matrix.check.name == 'maven-central'
        uses: ./.github/actions/await-maven-central
        with:
          version: ${{ needs.build-and-stage-release.outputs.version }}
          staging-root: ${{ matrix.check.staging-root }}

      # 实现 jar 会经 CDN 重定向，不适用 HEAD 判定，故等待各 plugin marker 的 pom。
      - name: Await Plugin Portal (${{ matrix.check.name }})
        if: matrix.check.name != 'maven-central'
        uses: ./.github/actions/await-http-resource
        with:
          url: ${{ matrix.check.url }}

  publish-gradle-plugin:
    name: Publish Gradle Plugin
    if: github.repository_owner == 'TAKETODAY'
    needs:
      - build-and-stage-release
    runs-on: 'ubuntu-latest'
    timeout-minutes: 60
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
      - name: Publish
        uses: ./.github/actions/publish-gradle-plugin
        with:
          gradle-plugin-publish-key: ${{ secrets.GRADLE_PLUGIN_PUBLISH_KEY }}
          gradle-plugin-publish-secret: ${{ secrets.GRADLE_PLUGIN_PUBLISH_SECRET }}
          plugin-version: ${{ needs.build-and-stage-release.outputs.version }}
          signing-keyId: ${{ secrets.SIGNID }}
          signing-password: ${{ secrets.SIGNPWD }}
          signing-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
