name: Release
on:
  push:
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  build-and-stage-release:
    name: Build and Stage Release
    if: github.repository_owner == 'TAKETODAY'
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7

      - name: Set Up Java
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '25'
          gpg-passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          server-id: release
          server-username: ${{ secrets.SNAPSHOTS_USERNAME }}
          server-password: ${{ secrets.SNAPSHOTS_TOKEN }}

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read Release Version
        id: release-version
        uses: ./.github/actions/read-version

      - name: Validate Release Version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          if [[ -z "$RELEASE_VERSION" || "$RELEASE_VERSION" == *SNAPSHOT ]]; then
            echo 'Release requires a non-empty, non-SNAPSHOT version in gradle.properties.' >&2
            exit 1
          fi

      - name: Build and Publish
        id: build-and-publish
        shell: bash
        env:
          ORG_GRADLE_PROJECT_repoUsername: ${{ secrets.SNAPSHOTS_USERNAME }}
          ORG_GRADLE_PROJECT_repoPassword: ${{ secrets.SNAPSHOTS_TOKEN }}
          SIGNING_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNPWD }}
          PUBLISH_SCRIPT: ${{ github.workspace }}/.github/scripts/central/publish-central.sh
          TEST_SCRIPT: ${{ github.workspace }}/.github/scripts/central/test-publish-central.sh
        run: |
          bash "$TEST_SCRIPT"
          bash "$PUBLISH_SCRIPT"

      - name: Preserve Central Publication State
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: central-publish-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/central-publish-state.json
          if-no-files-found: ignore

    outputs:
      version: ${{ steps.release-version.outputs.version }}

  sync-to-maven-central:
    name: Sync to Maven Central
    if: github.repository_owner == 'TAKETODAY'
    needs:
      - build-and-stage-release
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7

      - name: Await Sync to Maven Central
        uses: ./.github/actions/await-http-resource
        with:
          url: ${{ format('https://repo.maven.apache.org/maven2/cn/taketoday/infra-core/{0}/infra-core-{0}.jar', needs.build-and-stage-release.outputs.version) }}

      - name: Await Application Loader
        uses: ./.github/actions/await-http-resource
        with:
          url: ${{ format('https://repo.maven.apache.org/maven2/cn/taketoday/infra-app-loader/{0}/infra-app-loader-{0}.jar', needs.build-and-stage-release.outputs.version) }}

      - name: Await Plugin Dependencies
        uses: ./.github/actions/await-http-resource
        with:
          url: ${{ format('https://repo.maven.apache.org/maven2/cn/taketoday/infra-app-loader-tools/{0}/infra-app-loader-tools-{0}.jar', needs.build-and-stage-release.outputs.version) }}

      - name: Await Dependency BOM
        uses: ./.github/actions/await-http-resource
        with:
          url: ${{ format('https://repo.maven.apache.org/maven2/cn/taketoday/infra-dependencies/{0}/infra-dependencies-{0}.pom', needs.build-and-stage-release.outputs.version) }}

  publish-gradle-plugin:
    name: Publish Gradle Plugin
    if: github.repository_owner == 'TAKETODAY'
    needs:
      - build-and-stage-release
      - sync-to-maven-central
    runs-on: 'ubuntu-latest'
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
      - name: Publish
        uses: ./.github/actions/publish-gradle-plugin
        with:
          gradle-plugin-publish-key: ${{ secrets.GRADLE_PLUGIN_PUBLISH_KEY }}
          gradle-plugin-publish-secret: ${{ secrets.GRADLE_PLUGIN_PUBLISH_SECRET }}
          plugin-version: ${{ needs.build-and-stage-release.outputs.version }}
          signing-keyId: ${{ secrets.SIGNID }}
          signing-password: ${{ secrets.SIGNPWD }}
          signing-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
