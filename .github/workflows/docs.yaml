name: Docs

on:
  push:
    paths:
      - 'infra-docs/**'
      - '.github/workflows/docs.yaml'
      - '!**/README.md'

    branches:
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-docs:
    if: github.repository_owner == 'TAKETODAY'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Set up JDK 17 🔧
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: liberica

      - name: Setup Gradle 🔧
        uses: gradle/gradle-build-action@v3.1.0

      - name: Build Docs 🔧
        run: ./gradlew -DCI=true --no-daemon --no-configuration-cache --max-workers=4 :infra-docs:antora

      - name: Inspect generated documentation
        run: |
          echo "Generated HTML files:"
          find infra-docs/build -type f -name '*.html' | head -40
          echo "Site directory:"
          ls -la infra-docs/build/site
          echo "HTML count:"
          find infra-docs/build/site -type f -name '*.html' | wc -l
          test -s infra-docs/build/site/index.html
          test -d infra-docs/build/site/gradle-plugin

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: "${{ github.workspace }}/infra-docs/build/site"

      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v5
