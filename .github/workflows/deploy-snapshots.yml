name: Deploy

on:
  push:
    paths-ignore:
      - 'infra-samples/**'
      - '**/README.md'
      - '**/README.en.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'infra-docs/**'
      - 'src/docs/**'
      - 'logo.svg'
      - '.run/**'
      - '.idea/**'
      - '.gitignore'
      - '.editorconfig'
      - '.codacy.yaml'
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy-snapshot:
    if: github.repository_owner == 'TAKETODAY'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7

      - name: Read Version
        id: read-version
        uses: ./.github/actions/read-version

      - name: Set Up Java
        uses: actions/setup-java@v6
        with:
          distribution: liberica
          java-version: '25'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Deploy snapshot
        if: ${{ steps.read-version.outputs.snapshot == 'true' }}
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SNAPSHOTS_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SNAPSHOTS_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.SIGNID }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNPWD }}
        run: ./gradlew --no-daemon --no-parallel publish
