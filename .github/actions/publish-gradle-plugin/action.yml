name: Publish Gradle Plugin
description: 'Publishes Infra App''s Gradle plugin to the Plugin Portal'
inputs:
  gradle-plugin-publish-key:
    description: 'Gradle publishing key'
    required: true
  gradle-plugin-publish-secret:
    description: 'Gradle publishing secret'
    required: true
  plugin-version:
    description: 'Version of the plugin'
    required: true
  signing-keyId:
    description: 'Signing key ID'
    required: true
  signing-password:
    description: 'Signing key password'
    required: true
  signing-key:
    description: 'ASCII-armored signing private key'
    required: true
runs:
  using: composite
  steps:
    - name: Set Up Java
      uses: actions/setup-java@v6
      with:
        distribution: 'liberica'
        java-version: '25'
    - name: Set Up Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Publish
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GRADLE_PUBLISH_KEY: ${{ inputs.gradle-plugin-publish-key }}
        GRADLE_PUBLISH_SECRET: ${{ inputs.gradle-plugin-publish-secret }}
        ORG_GRADLE_PROJECT_version: ${{ inputs.plugin-version }}
        ORG_GRADLE_PROJECT_signing.keyId: ${{ inputs.signing-keyId }}
        ORG_GRADLE_PROJECT_signing.password: ${{ inputs.signing-password }}
        ORG_GRADLE_PROJECT_signing.key: ${{ inputs.signing-key }}
      run: |
        if [[ "$ORG_GRADLE_PROJECT_version" == *SNAPSHOT ]]; then
          echo 'Plugin Portal requires a non-SNAPSHOT version.' >&2
          exit 1
        fi
        ./gradlew --no-daemon :infra-build:infra-gradle-plugin:publishPlugins -PportalPublishing=true -PbuildSrc.skipTests=true
