name: Await HTTP Resource
description: 'Waits for an HTTP resource to be available (a HEAD request succeeds)'
inputs:
  url:
    description: 'URL of the resource to await'
    required: true
runs:
  using: composite
  steps:
    - name: Await HTTP resource
      shell: bash
      env:
        RESOURCE_URL: ${{ inputs.url }}
      run: |
        echo "Waiting for $RESOURCE_URL"
        until curl --fail --head --location --silent --show-error \
          --connect-timeout 10 --max-time 30 "$RESOURCE_URL" > /dev/null
        do
          echo "."
          sleep 60
        done
        echo "$RESOURCE_URL is available"
