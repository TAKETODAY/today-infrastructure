description = "Infra application RestTestClient integration"

dependencies {
  api(project(":infra-app"))
  api project(":infra-web-client")
  api project(":infra-test")

  optional 'org.apache.httpcomponents.core5:httpcore5'
  optional 'org.apache.httpcomponents.core5:httpcore5-reactive'
  optional 'org.apache.httpcomponents.client5:httpclient5'
  testImplementation(project(":infra-app"))

  testImplementation project(":infra-webmvc-mock")
  testImplementation "org.hamcrest:hamcrest"
  testImplementation 'io.projectreactor:reactor-test'
  testImplementation testFixtures(project(':infra-web-netty-server'))
}