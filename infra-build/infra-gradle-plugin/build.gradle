plugins {
  id "java-gradle-plugin"
  id "com.gradle.plugin-publish" version "2.2.1" apply false
}

description = "Run and package TODAY Infrastructure applications as executable jars or wars, " +
    "with automatic dependency management, opt-in AOT processing and GraalVM native-image integration."


dependencies {
  implementation(project(":infra-core"))
  implementation(project(":infra-build:infra-app-loader"))
  implementation(project(":infra-build:infra-app-loader-tools"))

  optional "org.graalvm.buildtools:native-gradle-plugin"
  implementation 'org.apache.commons:commons-compress'
  implementation 'io.spring.gradle:dependency-management-plugin'

  testImplementation(project(":infra-aop"))
  testImplementation(project(":infra-app"))
  testImplementation(project(":infra-test-support"))

  testImplementation("tools.jackson.core:jackson-databind")

  testImplementation("com.tngtech.archunit:archunit-junit5:0.22.0")
  testImplementation("org.apache.httpcomponents.client5:httpclient5")
  testImplementation("org.assertj:assertj-core")
  testImplementation("org.junit.jupiter:junit-jupiter")
  testImplementation("org.mockito:mockito-core")
  testImplementation("org.testcontainers:testcontainers-junit-jupiter")
  testImplementation("org.testcontainers:testcontainers")
  testImplementation 'org.jboss.logging:jboss-logging:3.5.3.Final'
  testImplementation("com.jayway.jsonpath:json-path")
  testImplementation("org.testcontainers:testcontainers")
  testImplementation("org.hamcrest:hamcrest")
  testImplementation("org.mockito:mockito-junit-jupiter")
  testImplementation("org.skyscreamer:jsonassert")
  testImplementation("net.java.dev.jna:jna-platform")
  testImplementation "commons-io:commons-io"
  testImplementation("org.tomlj:tomlj:1.0.0")
  testImplementation 'com.github.openjson:openjson:1.0.13'
}

def portalPublishing = providers.gradleProperty('portalPublishing').map { it.toBoolean() }.getOrElse(false)

if (portalPublishing) {
  apply plugin: 'com.gradle.plugin-publish'
}

gradlePlugin {
  automatedPublishing = true
  website = "https://github.com/TAKETODAY/today-infrastructure"
  vcsUrl = "https://github.com/TAKETODAY/today-infrastructure"

  plugins {
    create("infraPlugin") {
      id = "cn.taketoday.application"
      tags.set(['today-infrastructure', 'web', 'application', 'executable-jar', 'dependency-management', 'aot', 'native-image', 'graalvm'])
      displayName = "Infra Application Gradle Plugin"
      description = project.description
      implementationClass = "infra.gradle.plugin.InfraApplicationPlugin"
    }
  }
}

tasks.named('test') {
  def examplesDirectory = rootProject.layout.projectDirectory.dir('infra-docs/modules/gradle-plugin/examples')
  inputs.dir(examplesDirectory).withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName('buildScripts')
  systemProperty 'infra.gradle.docs.examples', examplesDirectory.asFile.absolutePath
}
